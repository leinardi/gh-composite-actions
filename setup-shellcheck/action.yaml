name: "Set up ShellCheck"
description: >-
  Installs a ShellCheck release binary onto PATH, verified against its published digest, instead
  of the runner image's own version, for every tool that runs the shellcheck it finds there:
  actionlint's -shellcheck over the workflows' run: scripts and droast's ShellCheck bridge. The
  version must match the shellcheck-py rev in the caller's .pre-commit-config.yaml, so local hooks
  and CI agree.

inputs:
  version:
    description: >-
      The ShellCheck release tag, e.g. v0.11.0. Override it together with sha256: a version without
      its own digest fails the digest check.
    required: false
    default: "v0.11.0"
  sha256:
    description: >-
      The sha256 of shellcheck-<version>.linux.x86_64.tar.xz, from
      `gh api repos/koalaman/shellcheck/releases/tags/<version>` (the asset's digest).
    required: false
    default: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"

outputs:
  path:
    description: "The directory holding the installed shellcheck, already on PATH for later steps."
    value: ${{ steps.install.outputs.path }}

runs:
  using: "composite"
  steps:
    # Unpacked under RUNNER_TEMP and put on GITHUB_PATH, ahead of the runner image's own
    # /usr/bin/shellcheck, rather than installed with sudo into /usr/local/bin.
    - name: Install ShellCheck
      id: install
      shell: bash
      env:
        SHELLCHECK_VERSION: ${{ inputs.version }}
        SHELLCHECK_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        if ! [[ "${SHELLCHECK_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::setup-shellcheck: version '${SHELLCHECK_VERSION}' is not a release tag vX.Y.Z. Nothing was installed."
          exit 1
        fi
        if ! [[ "${SHELLCHECK_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
          echo "::error::setup-shellcheck: sha256 '${SHELLCHECK_SHA256}' is not a lowercase hex sha256. Nothing was installed."
          exit 1
        fi
        if [ "$(uname -m)" != "x86_64" ]; then
          echo "::error::setup-shellcheck installs the x86_64 asset only (got $(uname -m)). Nothing was installed."
          exit 1
        fi

        work="$(mktemp -d "${RUNNER_TEMP}/setup-shellcheck.XXXXXX")"
        archive="${work}/shellcheck.tar.xz"
        curl -fsSL --proto '=https' --retry 3 -o "${archive}" \
          "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
        echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum --check --strict -
        tar -xJf "${archive}" -C "${work}"
        bin_dir="${work}/shellcheck-${SHELLCHECK_VERSION}"
        chmod 0755 "${bin_dir}/shellcheck"
        if ! "${bin_dir}/shellcheck" --version | grep -qx "version: ${SHELLCHECK_VERSION#v}"; then
          echo "::error::setup-shellcheck: the unpacked shellcheck does not report version ${SHELLCHECK_VERSION#v}. Nothing was put on PATH."
          exit 1
        fi
        echo "${bin_dir}" >> "${GITHUB_PATH}"
        echo "path=${bin_dir}" >> "${GITHUB_OUTPUT}"

    # A later step sees GITHUB_PATH; this one proves the shellcheck every later step resolves is
    # the one just installed, not the runner image's.
    - name: Check ShellCheck is on PATH
      shell: bash
      env:
        WANT: ${{ steps.install.outputs.path }}/shellcheck
      run: |
        set -euo pipefail
        got="$(command -v shellcheck || true)"
        if [ "${got}" != "${WANT}" ]; then
          echo "::error::setup-shellcheck: shellcheck resolves to ${got}, not ${WANT}."
          exit 1
        fi
        shellcheck --version
