name: "Set up cargo-deny"
description: >-
  Installs a cargo-deny release binary onto PATH, verified against its published digest, so every
  job that checks the dependency graph (advisories, licenses, bans, sources) runs the same release.

inputs:
  version:
    description: >-
      The cargo-deny release, e.g. 0.20.2. Override it together with sha256: a version without its
      own digest fails the digest check.
    required: false
    default: "0.20.2"
  sha256:
    description: >-
      The sha256 of cargo-deny-<version>-x86_64-unknown-linux-musl.tar.gz, from the release asset's
      .sha256 at https://github.com/EmbarkStudios/cargo-deny/releases/download/<version>/.
    required: false
    default: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"

outputs:
  path:
    description: "The directory holding the installed cargo-deny, already on PATH for later steps."
    value: ${{ steps.install.outputs.path }}

runs:
  using: "composite"
  steps:
    # Unpacked under RUNNER_TEMP and put on GITHUB_PATH rather than installed with sudo into
    # /usr/local/bin; `cargo deny` finds the cargo-deny binary on PATH.
    - name: Install cargo-deny
      id: install
      shell: bash
      env:
        CARGO_DENY_VERSION: ${{ inputs.version }}
        CARGO_DENY_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        if ! [[ "${CARGO_DENY_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::setup-cargo-deny: version '${CARGO_DENY_VERSION}' is not a release X.Y.Z. Nothing was installed."
          exit 1
        fi
        if ! [[ "${CARGO_DENY_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
          echo "::error::setup-cargo-deny: sha256 '${CARGO_DENY_SHA256}' is not a lowercase hex sha256. Nothing was installed."
          exit 1
        fi
        if [ "$(uname -m)" != "x86_64" ]; then
          echo "::error::setup-cargo-deny installs the x86_64 asset only (got $(uname -m)). Nothing was installed."
          exit 1
        fi

        work="$(mktemp -d "${RUNNER_TEMP}/setup-cargo-deny.XXXXXX")"
        release="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
        archive="${work}/${release}.tar.gz"
        curl -fsSL --proto '=https' --retry 3 -o "${archive}" \
          "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${release}.tar.gz"
        echo "${CARGO_DENY_SHA256}  ${archive}" | sha256sum --check --strict -
        tar -xzf "${archive}" -C "${work}"
        bin_dir="${work}/${release}"
        chmod 0755 "${bin_dir}/cargo-deny"
        if ! "${bin_dir}/cargo-deny" --version | grep -qx "cargo-deny ${CARGO_DENY_VERSION}"; then
          echo "::error::setup-cargo-deny: the unpacked cargo-deny does not report version ${CARGO_DENY_VERSION}. Nothing was put on PATH."
          exit 1
        fi
        echo "${bin_dir}" >> "${GITHUB_PATH}"
        echo "path=${bin_dir}" >> "${GITHUB_OUTPUT}"

    - name: Check cargo-deny is on PATH
      shell: bash
      env:
        WANT: ${{ steps.install.outputs.path }}/cargo-deny
      run: |
        set -euo pipefail
        got="$(command -v cargo-deny || true)"
        if [ "${got}" != "${WANT}" ]; then
          echo "::error::setup-cargo-deny: cargo-deny resolves to ${got}, not ${WANT}."
          exit 1
        fi
        cargo-deny --version
